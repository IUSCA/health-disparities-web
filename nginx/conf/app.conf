# https://blog.nginx.org/blog/rate-limiting-nginx
# cannot make a request from an IP for any URL within 50 ms of its previous one
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=20r/s;

server {
    listen 8000;

    server_name localhost;

    root /opt/sca/data;

    # whitelist IPs
    allow 172.18.0.0/24;
    deny all;

    location / {
        # queues upto 20 requests in excess of the rate limit
        # nodelay means that the excess requests are not delayed and are processed immediately but slot is unblocked at the rate limit 
        limit_req zone=mylimit burst=20 nodelay;
        
        proxy_pass http://host.docker.internal:3030/;
        # proxy_http_version 1.1;
        # proxy_set_header Connection "";
        # proxy_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # the “X-Forwarded-For” client request header field with the $remote_addr variable appended to it, separated by a comma. 
        # If the “X-Forwarded-For” field is not present in the client request header, the $proxy_add_x_forwarded_for variable is equal to the $remote_addr variable.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # preserve authorization header
        proxy_set_header Authorization $http_authorization;

        # Add a custom header to differentiate between servers
        proxy_set_header X-Server-Type "api";
    }

    location /data/ {
      internal;
      alias /opt/sca/data/;

      # Force file download headers
      # add_header Content-disposition "attachment";
      add_header Access-Control-Allow-Origin *;
    }
}